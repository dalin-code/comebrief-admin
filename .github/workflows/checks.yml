name: Checks

# 后台仓库的静态检查。跑的是「不需要网络、不需要数据库、不需要密钥」的三件事，
# 所以可以在 PR 上无条件绿灯/红灯，不会因为额度或凭据缺席变成噪音。
#
#   typecheck   —— tsc --noEmit
#   check:quiz  —— scripts/check-quiz.mjs：axes 卷的 38 条断言（全枚举 / 12 项检查 / 仲裁）
#   check:pack  —— scripts/p13-quiz-pack-check.mts：批量导入的解析 / 校验 / 归一化（含 axes）
#
# 为什么 check:quiz 必须进 CI：
#   axes 模型的「某个原型再也抽不到」是一类**静默**故障 —— 页面照常渲染，
#   只是永远给出同几个结果。只有把 65,536 种组合全枚举一遍才看得见，
#   而人评审时不会去算。把它钉在 CI 上，改卷的人才必须面对它。
#
# 为什么这里**不**跑 `npm run lint`：
#   仓库里现存 6 个 eslint error（app/admin/(protected)/trends 等页面的
#   setState-in-effect / 未转义引号），与本模块无关。把它塞进 CI 只会让
#   每条 PR 天生红灯，红灯就不再传递信号了。等那 6 个修掉再加这一步
#   —— 单独跑 `npx eslint <改动的文件>` 仍然有用，新代码是零 warning 的。
#
# 需要 Node ≥ 24：脚本直接 import '../lib/quizAxes.ts'，靠 Node 原生剥类型
# （不需要 --import ./scripts/_ts-resolve.mts，因为 quizAxes.ts 零依赖）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # next build / tsc 在 CI 里不该碰到真项目；这里只做类型检查与脚本断言，
      # 但仍然备一组明显的占位值，防止某个 import 顺手读了 process.env 就炸。
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Quiz axes checks
        run: npm run check:quiz

      # 导入链路的断言（模板能过校验 / 三类脏输入 / axes 卷的 blocker 与 CI 同源）。
      # 它不联网也不碰数据库，所以和 check:quiz 一样可以无条件绿灯。
      - name: Quiz pack checks
        run: npm run check:pack

      # Quiz Studio 的列表口径：分类归一 / 旧卷健康分 / 复制载荷 / 矩阵 raw_data。
      # 与后台 /admin/quiz-studio 共用 lib/quizStudio.ts，改坏会在这里先红。
      - name: Quiz studio checks
        run: npm run check:studio

      # AI 起草的契约层：kit 归一化 / 五条硬规则 / 3-1 权重编译 / 全枚举分布。
      # 与 /admin/quizzes/create 的「AI 起草」向导共用 lib/quizKit + lib/quizCompile。
      - name: Quiz kit checks
        run: npm run check:kit

      # 文本粘贴路径：模板必须自己过四层闸 / 行号 / 往返 / 6–10 题区间 / 四类负样本。
      # 与批量导入弹窗的「文本」模式共用 lib/quizText。
      # 这条**必须**在 CI 里：模板过不了闸时，弹窗里的「模板」按钮就是在教人写错的东西，
      # 而模板坏了没人会自己发现（它是被「插入」的，不是被「改」的）。
      - name: Quiz text checks
        run: npm run check:text

      # 趋势采集的纯逻辑：RSS/Atom 解析（含 ht: 命名空间与 CDATA）/ 去重 / 轮转合并 /
      # 敏感词过滤 / 热词抽取。**不联网**，夹具是三个源的真实响应切片。
      - name: Trend collection checks
        run: npm run check:trends

      # 英文文案的机械语法闸：a/an、重复词、句首大小写、标点空格、配对符号。
      # 与 /api/news/save、/api/admin/articles/draft、/api/ai/excerpt、
      # /api/ai/story/finalize 共用 lib/textQuality.ts，改规则会在这里先红。
      - name: Grammar gate checks
        run: npm run check:grammar

      # 站点 origin 的归一化：环境变量被粘成 `[https://…] (https://…)` 时，
      # IndexNow / 前台刷新 / 广告兜底跳转全会坏（2026-11-25 线上就是这么坏的）。
      # 这个脏值不会让 typecheck 变红，只能靠断言钉住。
      - name: Site URL normalization checks
        run: npm run check:site-url
